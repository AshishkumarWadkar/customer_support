version: '3.9'

services:
  # ─── MySQL Database ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: support_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-support_db}
      MYSQL_USER: ${DB_USER:-support_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-supportpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    networks:
      - support_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-support_user}", "-p${DB_PASSWORD:-supportpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine            # minimal Alpine image; runs as uid 999 (redis)
    container_name: support_redis
    restart: unless-stopped
    user: "999:999"                  # non-root redis user (uid:gid in redis:alpine)
    security_opt:
      - no-new-privileges:true       # prevent privilege escalation inside container
    read_only: true                  # root filesystem is read-only
    tmpfs:
      - /tmp:size=64m,mode=1777      # Redis scratch space
      - /var/run/redis:size=8m       # PID file location (see redis.conf pidfile)
    # Port 6379 is NOT published to the host — Redis is reachable only on the
    # internal Docker network. TLS listener is on 6380 (internal only).
    # Remove the ports block entirely for production; keep for local dev only:
    # ports:
    #   - "127.0.0.1:6380:6380"
    volumes:
      - redis_data:/data                                  # AOF + RDB persistence
      - ./redis.conf:/etc/redis/redis.conf:ro             # server config (read-only)
      - ./redis-tls:/etc/redis/tls:ro                     # TLS certs (read-only)
    networks:
      - support_network
    # requirepass is passed on the command line so the secret is never written
    # into redis.conf on disk. The config file sets port 0 (plain disabled) and
    # tls-port 6380; this command loads that file then appends the password.
    command: >
      redis-server /etc/redis/redis.conf
      --requirepass "${REDIS_PASSWORD:-redissecret}"
    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "--no-auth-warning"
        - "-a"
        - "${REDIS_PASSWORD:-redissecret}"
        - "--tls"
        - "--cert"
        - "/etc/redis/tls/server.crt"
        - "--key"
        - "/etc/redis/tls/server.key"
        - "--cacert"
        - "/etc/redis/tls/ca.crt"
        - "-p"
        - "6380"
        - "ping"
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Backend API ─────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: support_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-support_db}
      DB_USER: ${DB_USER:-support_user}
      DB_PASSWORD: ${DB_PASSWORD:-supportpassword}
      REDIS_HOST: redis
      REDIS_PORT: 6380                                  # TLS port
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redissecret}
      REDIS_TLS: "true"
      REDIS_TLS_CA: /etc/redis/tls/ca.crt
      REDIS_TLS_REJECT_UNAUTHORIZED: "true"             # set to "false" only for self-signed dev certs
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: 1h
      JWT_REFRESH_EXPIRY: 7d
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Support Team}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - ./redis-tls/ca.crt:/etc/redis/tls/ca.crt:ro    # CA cert for Redis TLS verification
    networks:
      - support_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend App ─────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    container_name: support_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - support_network

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine          # pinned minimal Alpine image
    container_name: support_nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true        # prevent privilege escalation inside container
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro   # read-only config mount
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - support_network

volumes:
  mysql_data:
    name: support_mysql_data
  redis_data:
    name: support_redis_data
  backend_uploads:
    name: support_backend_uploads
  backend_logs:
    name: support_backend_logs

networks:
  support_network:
    name: support_network
    driver: bridge
