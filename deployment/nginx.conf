# =============================================================================
# Nginx Reverse Proxy Configuration
# Support Platform — Production
# =============================================================================
#
# Security hardening applied:
#   • Minimal nginx:1.27-alpine image (no-new-privileges via docker-compose)
#   • Config mounted read-only (:ro) in docker-compose.yml
#   • Server tokens hidden (server_tokens off)
#   • Security headers on every response:
#       - X-Frame-Options: DENY
#       - X-Content-Type-Options: nosniff
#       - Content-Security-Policy (strict)
#       - Referrer-Policy, Permissions-Policy, HSTS (HTTPS block)

user  nginx;
worker_processes  auto;                  # one worker per CPU core
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # ── Performance ───────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript
                       text/xml application/xml application/xml+rss text/javascript;

    # ── Security: hide nginx version ──────────────────────────────────────
    server_tokens off;

    # ── Upstreams ─────────────────────────────────────────────────────────
    upstream backend_api {
        server backend:5000;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:80;
        keepalive 16;
    }

    # =========================================================================
    # HTTP — redirect all traffic to HTTPS
    # =========================================================================
    server {
        listen       80;
        listen  [::]:80;
        server_name  _;

        # Allow Let's Encrypt / ACME challenge through before redirect
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # HTTPS — main server block
    # =========================================================================
    server {
        listen       443 ssl;
        listen  [::]:443 ssl;
        http2        on;
        server_name  _;

        # ── TLS ───────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Security Headers ──────────────────────────────────────────────
        #
        # X-Frame-Options: prevent clickjacking — disallows this page being
        # embedded in any <frame>, <iframe>, <embed>, or <object>.
        add_header X-Frame-Options "DENY" always;

        # X-Content-Type-Options: prevent MIME-type sniffing — forces the
        # browser to honour the declared Content-Type and not guess.
        add_header X-Content-Type-Options "nosniff" always;

        # Content-Security-Policy: restrict resource origins to same-origin
        # only; explicitly block object/embed/base-uri hijacking.
        # Adjust connect-src and img-src if you use third-party CDNs.
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self'; "
            "style-src 'self' 'unsafe-inline'; "
            "img-src 'self' data:; "
            "font-src 'self'; "
            "connect-src 'self'; "
            "object-src 'none'; "
            "base-uri 'self'; "
            "form-action 'self'; "
            "frame-ancestors 'none';"
            always;

        # Referrer-Policy: send no referrer header on cross-origin navigation.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions-Policy: opt out of browser features not used by the app.
        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
            always;

        # HSTS: instruct browsers to always use HTTPS for this origin
        # (max-age=1 year; remove includeSubDomains if subdomains are HTTP).
        add_header Strict-Transport-Security
            "max-age=31536000; includeSubDomains; preload"
            always;

        # ── Proxy common settings ─────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # ── API routes → backend ──────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend_api;

            # Disable buffering for SSE / streaming responses
            proxy_buffering    off;
            proxy_cache_bypass $http_upgrade;
        }

        # ── WebSocket support (Socket.io) ─────────────────────────────────
        location /socket.io/ {
            proxy_pass http://backend_api;
            proxy_buffering off;
        }

        # ── Health check (bypass auth) ────────────────────────────────────
        location /health {
            proxy_pass http://backend_api;
            access_log off;
        }

        # ── Frontend SPA → frontend container ────────────────────────────
        location / {
            proxy_pass http://frontend_app;

            # Cache static assets aggressively; let the SPA router handle 404s
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }

        # ── Block hidden files (.env, .git, etc.) ─────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
