# =============================================================================
# Redis Server Configuration
# Support Platform — Production
# =============================================================================
#
# Security hardening applied:
#   • AUTH password enforced via requirepass (set at runtime via env var
#     substitution — see docker-compose command override)
#   • TLS listener on port 6380; plain-text port 6379 disabled
#   • Runs as uid 999 (redis user in redis:alpine image) — non-root
#   • Container launched with no-new-privileges:true and read_only:true
#     (writable paths: /data volume + /tmp tmpfs + /var/run/redis tmpfs)
#   • Protected mode on (rejects connections from non-loopback IPs without AUTH)
#   • Dangerous commands disabled (FLUSHALL, FLUSHDB, CONFIG, DEBUG, KEYS)
#
# TLS note:
#   Certificates must be provisioned into deployment/redis-tls/ before starting:
#     redis-tls/ca.crt       — CA that signed the server certificate
#     redis-tls/server.crt   — Redis server certificate
#     redis-tls/server.key   — Redis server private key
#   See deployment-guide.md §Redis TLS for generation instructions.
# =============================================================================

# ── Network ──────────────────────────────────────────────────────────────────

# Bind only to the Docker-internal interface; the port is NOT published to the
# host in docker-compose (removed "6379:6379" binding for production).
bind 0.0.0.0

# Protected mode: reject unauthenticated connections that arrive from non-
# loopback addresses. Acts as a safety net even if bind is open.
protected-mode yes

# Disable the plain-text port — all traffic must go through TLS (port 6380).
port 0

# ── TLS ──────────────────────────────────────────────────────────────────────

tls-port 6380
tls-cert-file /etc/redis/tls/server.crt
tls-key-file  /etc/redis/tls/server.key
tls-ca-cert-file /etc/redis/tls/ca.crt

# Only allow TLS 1.2 and 1.3
tls-protocols "TLSv1.2 TLSv1.3"

# Strong cipher suites (TLS 1.2); TLS 1.3 cipher selection is automatic.
tls-ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# Require clients to present a certificate (mTLS). Set to "no" if your backend
# does not have a client certificate; set to "yes" for full mutual TLS.
tls-auth-clients no

# ── Authentication ────────────────────────────────────────────────────────────

# requirepass is injected at container start via the docker-compose `command`
# override so the secret never lives in this file on disk:
#   redis-server /etc/redis/redis.conf --requirepass "${REDIS_PASSWORD}"
# This placeholder is intentionally left blank.
# requirepass <set-via-command-line>

# ── Persistence ───────────────────────────────────────────────────────────────

# Append-only file: every write is durable (fsync every second)
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# AOF and RDB files go into /data (the named Docker volume)
dir /data
dbfilename dump.rdb
appendfilename appendonly.aof

# ── Memory ───────────────────────────────────────────────────────────────────

maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Runtime paths (writable via tmpfs in read_only container) ─────────────────

pidfile /var/run/redis/redis.pid
logfile ""          # log to stdout (captured by Docker)
loglevel notice

# ── Disable dangerous commands ────────────────────────────────────────────────
# Renames them to empty strings, making them uncallable.

rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command CONFIG   ""
rename-command DEBUG    ""
rename-command KEYS     ""
rename-command SHUTDOWN SHUTDOWN_SAFE

# ── Connection limits ─────────────────────────────────────────────────────────

maxclients 100
timeout 300
tcp-keepalive 60
